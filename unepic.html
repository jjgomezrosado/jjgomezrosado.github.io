<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unepic — Loot Wiki</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:            #0d0a07;
    --bg2:           #13100c;
    --bg3:           #1c1610;
    --bg4:           #221a10;
    --border:        #3a2e1e;
    --border-bright: #6b4f2a;
    --gold:          #c9922a;
    --gold-light:    #e8b84b;
    --gold-dim:      #7a5a1a;
    --text:          #d4c4a0;
    --text-dim:      #7a6a50;
    --text-bright:   #f0e0c0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(100,60,10,.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(50,20,80,.10) 0%, transparent 50%);
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  header::before {
    content:'';
    position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  header h1 {
    font-family:'Cinzel',serif; font-size:clamp(2rem,5vw,3.5rem);
    font-weight:900; color:var(--gold-light); letter-spacing:.15em;
    text-shadow:0 0 30px rgba(200,150,40,.4), 0 2px 4px rgba(0,0,0,.8);
  }
  header p { color:var(--text-dim); font-style:italic; font-size:.95rem; margin-top:.3rem; }

  /* ── LAYOUT ── */
  .container { max-width:1400px; margin:0 auto; padding:1.5rem; }

  .stats-bar { display:flex; gap:1.5rem; margin-bottom:1.2rem; flex-wrap:wrap; }
  .stat-item { font-size:.82rem; color:var(--text-dim); }
  .stat-item strong { color:var(--gold); font-family:'Cinzel',serif; font-size:1rem; }

  /* ── TABS ── */
  .tabs {
    display:flex; gap:0; border-bottom:2px solid var(--border);
    margin-bottom:1.5rem; overflow-x:auto;
    scrollbar-width:thin; scrollbar-color:var(--border) transparent;
  }
  .tab-btn {
    background:none; border:none; border-bottom:2px solid transparent;
    color:var(--text-dim); font-family:'Cinzel',serif; font-size:.78rem;
    letter-spacing:.1em; padding:.7rem 1.1rem; cursor:pointer;
    white-space:nowrap; transition:all .2s; margin-bottom:-2px; text-transform:uppercase;
  }
  .tab-btn:hover { color:var(--gold); }
  .tab-btn.active {
    color:var(--gold-light); border-bottom-color:var(--gold);
    background:linear-gradient(180deg,transparent,rgba(200,146,42,.08));
  }
  .panel { display:none; }
  .panel.active { display:block; }

  /* ── CONTROLS ── */
  .controls { display:flex; gap:.75rem; margin-bottom:1.2rem; flex-wrap:wrap; align-items:center; }
  .search-wrap { position:relative; flex:1; min-width:200px; }
  .search-wrap::before {
    content:'⚔'; position:absolute; left:.8rem; top:50%;
    transform:translateY(-50%); color:var(--gold-dim); font-size:.9rem;
  }
  input[type="text"], select {
    background:var(--bg3); border:1px solid var(--border); color:var(--text);
    font-family:'Crimson Pro',serif; font-size:.95rem; padding:.5rem .75rem;
    border-radius:3px; outline:none; transition:border-color .2s; width:100%;
  }
  .search-wrap input { padding-left:2.2rem; }
  input[type="text"]:focus, select:focus { border-color:var(--gold-dim); }
  select { cursor:pointer; min-width:160px; width:auto; }
  select option { background:var(--bg2); }

  /* ════════════════════════════════
     MAP LIST — lista expandible
  ════════════════════════════════ */
  .map-list { display:flex; flex-direction:column; gap:2px; }

  .map-row {
    border:1px solid var(--border);
    border-radius:3px;
    overflow:hidden;
    transition:border-color .2s;
  }
  .map-row.open { border-color:var(--gold-dim); }

  .map-row-header {
    display:flex; align-items:center; gap:.75rem;
    padding:.65rem 1rem; cursor:pointer;
    background:var(--bg2);
    transition:background .15s;
    user-select:none;
  }
  .map-row-header:hover { background:var(--bg3); }
  .map-row.open .map-row-header { background:var(--bg4); }

  .map-row-arrow {
    color:var(--gold-dim); font-size:.7rem; transition:transform .2s; flex-shrink:0;
  }
  .map-row.open .map-row-arrow { transform:rotate(90deg); color:var(--gold); }

  .map-row-name {
    font-family:'Cinzel',serif; font-size:.85rem; color:var(--text-bright);
    font-weight:600; letter-spacing:.04em; flex:1; min-width:0;
  }
  .map-row.open .map-row-name { color:var(--gold-light); }

  .map-row-badges { display:flex; gap:.3rem; flex-wrap:wrap; flex-shrink:0; }
  .map-badge {
    font-size:.65rem; padding:.1rem .4rem; border-radius:2px;
    font-family:'Cinzel',serif; letter-spacing:.04em;
    border:1px solid; opacity:.8; white-space:nowrap;
  }

  /* ── EXPANDED BODY ── */
  .map-row-body {
    display:none;
    padding:1rem 1.2rem 1.2rem;
    background:linear-gradient(180deg, var(--bg4) 0%, var(--bg2) 100%);
    border-top:1px solid var(--border);
  }
  .map-row.open .map-row-body { display:block; }

  .map-items-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:.75rem;
  }

  /* ── ITEM CARD ── */
  .item-card {
    background:var(--bg); border:1px solid var(--border); border-left-width:3px;
    border-radius:3px; padding:.75rem .9rem;
    cursor:pointer; transition:border-color .2s, transform .15s;
  }
  .item-card:hover { border-color:var(--border-bright); transform:translateY(-1px); }

  .item-card-top {
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:.5rem; margin-bottom:.45rem;
  }
  .item-card-name {
    font-weight:600; color:var(--text-bright); font-size:.9rem; line-height:1.3;
  }
  .item-card-cat {
    font-family:'Cinzel',serif; font-size:.6rem; letter-spacing:.07em;
    text-transform:uppercase; white-space:nowrap; flex-shrink:0; margin-top:.1rem;
  }

  .item-stats { font-size:.8rem; line-height:1.55; }
  .item-stat  { display:flex; gap:.5rem; }
  .stat-lbl   { color:var(--gold-dim); min-width:52px; flex-shrink:0; }
  .stat-val   { color:var(--text); }
  .stat-bonus { color:var(--text-dim); white-space:pre-line; line-height:1.4; }

  .item-card-special {
    margin-top:.45rem; font-size:.8rem; font-style:italic; color:var(--gold);
    border-top:1px solid var(--border); padding-top:.35rem; line-height:1.35;
  }
  .guaranteed-tag {
    display:inline-block; background:var(--gold-dim); color:var(--bg);
    font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.05em;
    padding:.05rem .35rem; border-radius:2px; margin-left:.4rem;
    vertical-align:middle; font-weight:700;
  }
  .no-results { text-align:center; padding:2.5rem; color:var(--text-dim); font-style:italic; }

  /* ════════════════════════════════
     CATEGORY TABLE
  ════════════════════════════════ */
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  thead th {
    font-family:'Cinzel',serif; font-size:.7rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--gold); padding:.6rem .75rem;
    text-align:left; border-bottom:2px solid var(--border-bright);
    background:var(--bg2); cursor:pointer; white-space:nowrap;
    user-select:none; transition:color .15s;
  }
  thead th:hover { color:var(--gold-light); }
  thead th.sorted-asc::after  { content:' ↑'; color:var(--gold-light); }
  thead th.sorted-desc::after { content:' ↓'; color:var(--gold-light); }
  tbody tr { border-bottom:1px solid var(--border); transition:background .15s; cursor:pointer; }
  tbody tr:hover { background:rgba(100,70,20,.12); }
  tbody td { padding:.55rem .75rem; vertical-align:top; color:var(--text); }
  td.name-col  { font-weight:600; color:var(--text-bright); white-space:nowrap; }
  td.num-col   { text-align:right; color:var(--gold); font-variant-numeric:tabular-nums; }
  td.bonus-col { font-size:.82rem; color:var(--text-dim); max-width:280px; }
  td.map-col   { font-size:.82rem; color:var(--text-dim); font-style:italic; }

  /* ════════════════════════════════
     MODAL
  ════════════════════════════════ */
  .modal-bg {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.75); z-index:100;
    align-items:center; justify-content:center; padding:1rem;
  }
  .modal-bg.open { display:flex; }
  .modal {
    background:var(--bg2); border:1px solid var(--border-bright);
    border-radius:6px; max-width:520px; width:100%;
    max-height:80vh; overflow-y:auto; padding:1.5rem;
    position:relative; box-shadow:0 20px 60px rgba(0,0,0,.8);
  }
  .modal::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .modal h2       { font-family:'Cinzel',serif; color:var(--gold-light); font-size:1.3rem; margin-bottom:.3rem; }
  .modal-cat      { font-size:.78rem; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; margin-bottom:1rem; font-family:'Cinzel',serif; }
  .modal-field    { margin-bottom:.7rem; }
  .modal-field label { display:block; font-family:'Cinzel',serif; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:.2rem; }
  .modal-field .val  { color:var(--text); font-size:.92rem; white-space:pre-line; }
  .modal-field .val.highlight { color:var(--gold); font-weight:600; }
  .map-tag { display:inline-block; background:rgba(100,70,20,.2); border:1px solid var(--border); border-radius:2px; padding:.2rem .6rem; font-size:.82rem; color:var(--text-dim); margin:.2rem .2rem .2rem 0; font-style:italic; }
  .modal-close {
    position:absolute; top:1rem; right:1rem; background:none;
    border:1px solid var(--border); color:var(--text-dim);
    width:28px; height:28px; border-radius:3px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:1.1rem; transition:all .15s;
  }
  .modal-close:hover { border-color:var(--gold-dim); color:var(--gold); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--border-bright); }

  @media(max-width:600px){
    .controls { flex-direction:column; }
    select { width:100%; }
    .map-items-grid { grid-template-columns:1fr; }
    .map-row-badges { display:none; }
  }
</style>

// HELPERS
// ════════════════════════════════════════════════════════════════════
function resolveDropCat(drop) {
  if (drop.cat === "Armas" && drop.sub) return SUB2CAT[drop.sub] || drop.cat;
  return drop.cat;
}
function resolveDropItem(drop) {
  const cat = resolveDropCat(drop);
  const list = DB[cat] || [];
  return { cat, item: list.find(i => i.nombre.toLowerCase() === drop.nombre.toLowerCase()) || null };
}
function lookup(catName, nombre) {
  return (DB[catName]||[]).find(i => i.nombre.toLowerCase() === nombre.toLowerCase()) || null;
}
function getMapsForItem(catName, nombre) {
  return MAPS.filter(m => m.drops.some(d => resolveDropCat(d) === catName && d.nombre.toLowerCase() === nombre.toLowerCase())).map(m => m.name);
}

const tabs = document.getElementById('mainTabs');

const TAB_DEFS = [
  { id:'mapas', label:'🗺 Por Mapa' },
  ...Object.keys(CAT_META).map(k => ({ id:k, label:`${CAT_META[k].icon} ${k}` }))
];

function buildTabs() {
  TAB_DEFS.forEach((t,i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i===0?' active':'');
    btn.textContent = t.label;
    btn.dataset.tab = t.id;
    btn.onclick = () => switchTab(t.id);
    tabs.appendChild(btn);
  });
}
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id==='panel-'+id));
}

// MAP PANEL — lista con expansión inline
// ════════════════════════════════════════════════════════════════════
function buildMapPanel() {
  const panel = document.createElement('div');
  panel.id = 'panel-mapas';
  panel.className = 'panel active';

  panel.innerHTML = `
    <div class="controls">
      <div class="search-wrap"><input type="text" id="mapSearch" placeholder="Buscar mapa o ítem…"></div>
      <select id="mapCatFilter">
        <option value="">Todas las categorías</option>
        ${Object.keys(CAT_META).map(k=>`<option value="${k}">${CAT_META[k].icon} ${k}</option>`).join('')}
      </select>
    </div>
    <div class="map-list" id="mapList"></div>`;

  panelContainer.appendChild(panel);
  renderMapList('','');

  document.getElementById('mapSearch').addEventListener('input', e =>
    renderMapList(e.target.value, document.getElementById('mapCatFilter').value));
  document.getElementById('mapCatFilter').addEventListener('change', e =>
    renderMapList(document.getElementById('mapSearch').value, e.target.value));
}

function renderMapList(search, catFilter) {
  const list = document.getElementById('mapList');
  list.innerHTML = '';
  const s = search.toLowerCase().trim();
  let shown = 0;

  MAPS.forEach(map => {
    // apply category filter first
    let drops = catFilter
      ? map.drops.filter(d => resolveDropCat(d) === catFilter)
      : map.drops;

    // apply text search
    if (s) {
      const nameMatch = map.name.toLowerCase().includes(s);
      const itemMatch = drops.filter(d => d.nombre.toLowerCase().includes(s));
      if (!nameMatch && itemMatch.length === 0) return;
      // if map name matches show all (possibly filtered) drops; else only matching ones
      if (!nameMatch) drops = itemMatch;
    }

    if (drops.length === 0) return;

    // count by resolved category
    const catCounts = {};
    drops.forEach(d => {
      const c = resolveDropCat(d);
      catCounts[c] = (catCounts[c]||0)+1;
    });

    const badges = Object.entries(catCounts).map(([c,n]) => {
      const m = CAT_META[c]||{};
      return `<span class="map-badge" style="border-color:${m.color||'#666'};color:${m.color||'#aaa'}">${m.icon||''} ${c} ×${n}</span>`;
    }).join('');

    const row = document.createElement('div');
    row.className = 'map-row';
    row.innerHTML = `
      <div class="map-row-header">
        <span class="map-row-arrow">▶</span>
        <span class="map-row-name">${map.name}</span>
        <div class="map-row-badges">${badges}</div>
      </div>
      <div class="map-row-body">
        <div class="map-items-grid">${renderItemCards(drops)}</div>
      </div>`;

    row.querySelector('.map-row-header').addEventListener('click', () => {
      const wasOpen = row.classList.contains('open');
      document.querySelectorAll('.map-row.open').forEach(r => r.classList.remove('open'));
      if (!wasOpen) row.classList.add('open');
    });

    list.appendChild(row);
    shown++;
  });

  if (shown===0) list.innerHTML = '<div class="no-results">No se encontraron mapas con esos criterios.</div>';
}

function renderItemCards(drops) {
  return drops.map(drop => {
    const { cat, item } = resolveDropItem(drop);
    const meta = CAT_META[cat] || {};
    const nameHtml = `${drop.nombre}${drop.sub?` <small style="opacity:.6">(${drop.sub})</small>`:''}${drop.garantizado?`<span class="guaranteed-tag">GARANTIZADO</span>`:''}`;

    if (!item) {
      return `<div class="item-card" style="border-left-color:${meta.color||'#666'}">
        <div class="item-card-top">
          <span class="item-card-name">${nameHtml}</span>
          <span class="item-card-cat" style="color:${meta.color||'#aaa'}">${meta.icon||''} ${cat}</span>
        </div>
        <div class="item-stats" style="color:var(--text-dim);font-style:italic;font-size:.8rem">Sin datos disponibles</div>
      </div>`;
    }

    // Build stats rows
    let rows = '';
    if (item.nivel !== undefined && item.nivel !== null)
      rows += `<div class="item-stat"><span class="stat-lbl">Nivel</span><span class="stat-val">${item.nivel}</span></div>`;
    if (item.daño !== undefined && item.daño !== null)
      rows += `<div class="item-stat"><span class="stat-lbl">Daño</span><span class="stat-val">${item.daño}</span></div>`;
    if (item.tipo)
      rows += `<div class="item-stat"><span class="stat-lbl">Tipo</span><span class="stat-val">${item.tipo}</span></div>`;
    if (item.hechizo)
      rows += `<div class="item-stat"><span class="stat-lbl">Hechizo</span><span class="stat-val">${item.hechizo}</span></div>`;
    if (item.esencias)
      rows += `<div class="item-stat"><span class="stat-lbl">Esencias</span><span class="stat-val">${item.esencias}</span></div>`;
    if (item.bonus)
      rows += `<div class="item-stat"><span class="stat-lbl">Bonus</span><span class="stat-bonus">${item.bonus}</span></div>`;
    if (item.descripcion)
      rows += `<div class="item-stat"><span class="stat-lbl">Desc.</span><span class="stat-bonus">${item.descripcion}</span></div>`;

    const special = item.especial
      ? `<div class="item-card-special">${item.especial}</div>` : '';

    const safeNombre = item.nombre.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="item-card" style="border-left-color:${meta.color||'#666'}" onclick="openItem('${cat}','${safeNombre}')">
      <div class="item-card-top">
        <span class="item-card-name">${nameHtml}</span>
        <span class="item-card-cat" style="color:${meta.color||'#aaa'}">${meta.icon||''} ${cat}</span>
      </div>
      <div class="item-stats">${rows}</div>
      ${special}
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════════════
// CATEGORY PANELS — tabla ordenable
// ════════════════════════════════════════════════════════════════════
function buildCategoryPanel(catName) {
  const catItems = DB[catName] || [];
  const panel = document.createElement('div');
  panel.id = 'panel-'+catName;
  panel.className = 'panel';

  const sample = catItems[0] || {};
  const fields = ['nombre',
    ...['nivel','daño','tipo','hechizo','esencias','bonus','especial','descripcion'].filter(f => f in sample),
    'mapas'
  ];

  const itemsWithMaps = catItems.map(item => ({
    ...item,
    mapas: getMapsForItem(catName, item.nombre)
  }));

  panel.innerHTML = `
    <div class="controls">
      <div class="search-wrap"><input type="text" id="search-${catName}" placeholder="Buscar en ${catName}…"></div>
    </div>
    <div class="table-wrap" id="twrap-${catName}"></div>`;

  panelContainer.appendChild(panel);
  renderTable(catName, itemsWithMaps, fields, '', null, null);

  document.getElementById('search-'+catName).addEventListener('input', e => {
    const s = currentSort[catName]||{};
    renderTable(catName, itemsWithMaps, fields, e.target.value, s.col, s.dir);
  });
}

const LABELS = { nombre:'Nombre', nivel:'Nivel', daño:'Daño', tipo:'Tipo', hechizo:'Hechizo', esencias:'Esencias', bonus:'Bonus', especial:'Especial', descripcion:'Descripción', mapas:'Mapa(s)' };

function renderTable(catName, items, fields, search, sortCol, sortDir) {
  currentSort[catName] = {col:sortCol, dir:sortDir};
  const wrap = document.getElementById('twrap-'+catName);
  const s = search.toLowerCase();

  let rows = items.filter(item =>
    !s || Object.values(item).some(v => v && String(v).toLowerCase().includes(s))
  );

  if (sortCol) {
    rows = [...rows].sort((a,b) => {
      let va = a[sortCol]??'', vb = b[sortCol]??'';
      if (typeof va==='number'&&typeof vb==='number') return sortDir==='asc'?va-vb:vb-va;
      va=String(va).toLowerCase(); vb=String(vb).toLowerCase();
      return sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    });
  }

  if (rows.length===0) { wrap.innerHTML='<div class="no-results">No se encontraron ítems.</div>'; return; }

  let html = '<table><thead><tr>';
  fields.forEach(f => {
    const sorted = sortCol===f;
    const nextDir = sorted ? (sortDir==='asc'?'desc':'asc') : 'asc';
    html += `<th class="${sorted?'sorted-'+sortDir:''}" onclick="sortTable('${catName}','${f}','${nextDir}')">${LABELS[f]||f}</th>`;
  });
  html += '</tr></thead><tbody>';

  rows.forEach(item => {
    const safe = item.nombre.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    html += `<tr onclick="openItem('${catName}','${safe}')">`;
    fields.forEach(f => {
      const v = item[f];
      if (f==='nombre') html+=`<td class="name-col">${v||'—'}</td>`;
      else if (f==='nivel'||f==='daño') html+=`<td class="num-col">${v!==null&&v!==undefined?v:'—'}</td>`;
      else if (f==='mapas') {
        const txt = Array.isArray(v)&&v.length>0 ? v.join(', ') : '<span style="color:var(--text-dim)">—</span>';
        html+=`<td class="map-col">${txt}</td>`;
      }
      else html+=`<td class="bonus-col">${v?String(v).replace(/\n/g,'<br>'):'<span style="color:var(--text-dim)">—</span>'}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function sortTable(catName, col, dir) {
  const catItems = DB[catName]||[];
  const sample = catItems[0]||{};
  const fields = ['nombre',...['nivel','daño','tipo','hechizo','esencias','bonus','especial','descripcion'].filter(f=>f in sample),'mapas'];
  const itemsWithMaps = catItems.map(item=>({...item, mapas:getMapsForItem(catName,item.nombre)}));
  const search = document.getElementById('search-'+catName)?.value||'';
  renderTable(catName, itemsWithMaps, fields, search, col, dir);
}

// ════════════════════════════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════════════════════════════
function openItem(catName, nombre) {
  const item = lookup(catName, nombre);
  if (!item) return;
  const meta = CAT_META[catName]||{};
  const mapas = getMapsForItem(catName, nombre);

  const fld = (label,val,cls='') => val!=null&&val!==''
    ? `<div class="modal-field"><label>${label}</label><div class="val ${cls}">${String(val).replace(/\n/g,'<br>')}</div></div>` : '';

  let html = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>${item.nombre}</h2>
    <div class="modal-cat" style="color:${meta.color||'var(--text-dim)'}">${meta.icon||''} ${catName}</div>
    ${fld('Nivel requerido', item.nivel, 'highlight')}
    ${fld('Daño base',       item.daño,  'highlight')}
    ${fld('Tipo',            item.tipo)}
    ${fld('Hechizo',         item.hechizo)}
    ${fld('Esencias',        item.esencias)}
    ${fld('Bonus',           item.bonus)}`;

  if (item.especial) html += `<div class="modal-field"><label>Especial</label><div class="val" style="font-style:italic;color:var(--gold)">${item.especial}</div></div>`;
  html += fld('Descripción', item.descripcion);

  if (mapas.length>0) {
    html += `<div class="modal-field"><label>Se obtiene en</label><div style="margin-top:.3rem">${mapas.map(m=>`<span class="map-tag">🗺 ${m}</span>`).join('')}</div></div>`;
  } else {
    html += `<div class="modal-field"><label>Mapa</label><div class="val" style="color:var(--text-dim);font-style:italic">No registrado</div></div>`;
  }

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target===document.getElementById('modalBg'))
    document.getElementById('modalBg').classList.remove('open');
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

// ════════════════════════════════════════════════════════════════════
// STATS BAR
// ════════════════════════════════════════════════════════════════════
function buildStats() {
  const total = Object.values(DB).reduce((s,c)=>s+c.length,0);
  document.getElementById('globalStats').innerHTML = `
    <div class="stat-item"><strong>${MAPS.length}</strong> mapas con drops</div>
    <div class="stat-item"><strong>${total}</strong> ítems en total</div>
    <div class="stat-item"><strong>${Object.keys(DB).length}</strong> categorías</div>`;
}

// ════════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════════
buildTabs();
buildMapPanel();
Object.keys(CAT_META).forEach(buildCategoryPanel);
buildStats();
</script>
