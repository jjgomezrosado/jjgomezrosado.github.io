<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Proyectos | GitHub Pages</title>
    <style>
        :root {
            --primary-color: #2f3640;
            --accent-color: #0097e6;
            --bg-color: #f5f6fa;
            --text-color: #2f3640;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        p {
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .links-grid {
            display: grid;
            gap: 15px;
        }

        .link-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #dcdde1;
        }

        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cosas</h1>

        <div class="links-grid">
            <a href="unepic.html" class="link-card">Unepic item Wiki</a>
            </div>

        <footer>
            JJ 
        </footer>
    </div>

</body>
</html>
